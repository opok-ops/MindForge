[build-system]
# v6.7.2（Issue #18）：61.0（2022 年首个 PEP 621 支持）→ 84.2.1，
# 消除跨 23 个大版本的构建链陈旧差距；84.2.1 修复 wheel 标签与
# stable-ABI 校验改用 sysconfig 数据、free-threaded 3.13/3.14 扩展后缀问题。
requires = ["setuptools>=84.2.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mindforge-memory"
dynamic = ["version"]
description = "AI Agent 终身记忆系统 - 四层记忆架构 · 知识图谱 · 多模态支持"
readme = {file = "README.md", content-type = "text/markdown"}
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["ai", "agent", "memory", "knowledge-graph", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["cryptography>=50.0.2,<52"]

[project.urls]
Homepage = "https://github.com/opok-ops/MindForge"
Documentation = "https://opok-ops.github.io/MindForge/"
"Bug Reports" = "https://github.com/opok-ops/MindForge/issues"
Source = "https://github.com/opok-ops/MindForge"

[project.scripts]
MindForge = "mindforge.cli.main:main"
MindForge-mcp = "mindforge.mcp.server:main"
MindForge-bench = "mindforge.bench.cli:main"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "pytest-timeout"]
embedding = ["sentence-transformers>=2.7.0"]

# 所有源码统一位于 mindforge.* 命名空间下（物理目录即包目录），
# 不再以 core/mcp/api/cli/modules/adapters 等顶层名称进入 site-packages，
# 避免与其他库冲突。仓库根目录保留 MindForge.py 作为向后兼容入口。
[tool.setuptools]
packages = [
    "mindforge",
    "mindforge.core",
    "mindforge.modules",
    "mindforge.cli",
    "mindforge.api",
    "mindforge.mcp",
    "mindforge.adapters",
    "mindforge.daemon",
]
py-modules = ["MindForge"]

# 版本号唯一真值：mindforge/core/version.py 的 __version__
[tool.setuptools.dynamic]
version = {attr = "mindforge.core.version.__version__"}

# v6.7.2 hotfix 预备：Windows 3.12 CI 疑似测试挂死（Run tests 卡 30+min 无输出）。
# pytest-timeout 让每个测试 180s 强制 fail 并打印挂点栈（thread 法，Windows 兼容）；
# Linux 本地 118s 全量不受影响（最长单测试远低于 180s）。根因定位后移除。
[tool.pytest.ini_options]
timeout = 180
timeout_method = "thread"
