version: 2
updates:
  # 锁定 Python 依赖，每周自动提交升级 PR，人工 review 后合入，
  # 保障「数月不更新」期间依赖安全可控、不会静默漂移。
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # 仅升级补丁/次版本，不自动跨大版本（大版本需人工评估）。
    # 注意：Dependabot 的 versioning-strategy 控制的是「新版本号如何写进清单」，
    # 而不是升级幅度；真正决定是否跨大版本的是下面的 ignore 规则。
    versioning-strategy: increase
    ignore:
      # 大版本一律不自动提：需人工评估 breaking change 后手动升级。
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
      - "security"

  # 同步升级 GitHub Actions，避免 action 版本腐化导致 CI 失效。
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # action 跨大版本（如 v5 -> v7）常伴随输入/输出契约变更，需人工评估。
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels:
      - "github-actions"
