name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 确定性安装：先装运行依赖锁定版，再装开发/测试工具锁定版
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run tests
        run: |
          # v5.7.0：输出核心层 + 模块层覆盖率报告（pytest-cov 已锁定于 requirements-dev.txt）
          python -m pytest tests/ -v --tb=short --cov=core --cov=modules --cov-report=term-missing

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: .coverage
          retention-days: 14

      - name: Smoke test — CLI
        run: |
          python -c "from cli.main import main; main(['--help'])"

      - name: Smoke test — MCP tools/list
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          from mcp.server import _handle_tools_list
          tools = _handle_tools_list({})['tools']
          # 精确锁定工具数：官网/README 对外宣称 35 个（v5.7.6 新增
          # memory_supersede / memory_valid_at），此前阈值只卡 >=30，
          # 误删 3 个工具 CI 也不会报警。改为等值断言，让数量回归可被守护。
          assert len(tools) == 40, f'Expected exactly 40 tools, got {len(tools)}'
          print(f'MCP tools: {len(tools)} OK')
          "

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: No tracked source maps
        run: |
          MAPS=$(git ls-files '*.map')
          if [ -n "$MAPS" ]; then
            echo '::error::source map 文件被 git 跟踪（源码映射泄露风险，生产包可能带出源码）：'
            echo "$MAPS"
            exit 1
          fi
          echo 'no tracked source maps: OK'


      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"
          pip install bandit pip-audit

      - name: Bandit scan
        run: |
          # 仅对 HIGH 严重度失败，使安全扫描真正生效（历史上 `|| true` 形同虚设）。
          # 选用 -lll（= HIGH only）：项目代码经人工审查无真实 HIGH 漏洞；
          # 既有 Medium（B608 参数化占位符误报、scripts/baidu_push 的 B310/B314）
          # 均为可接受低风险，详见发布说明与安全报告，不阻断正常 CI。
          # 排除 .venv/venv/website/examples，避免本地或演示目录污染扫描结果。
          bandit -r . -x tests,.venv,venv,website,examples -lll

      - name: pip-audit
        run: |
          # 只审计项目直接依赖，不扫 runner 预装包（避免不可控的 CVE 噪音）
          python -c "import tomllib; print('\n'.join(tomllib.load(open('pyproject.toml','rb'))['project']['dependencies']))" > /tmp/reqs.txt
          pip-audit --strict -r /tmp/reqs.txt

  docs:
    # 文档与官网数字一致性守卫。
    # 背景：版本号与测试数此前**完全没有 CI 守护**，只断言了 MCP 工具数 == 33，
    # 结果反复漂移——代码已发到 v5.6.8 而官网还停在 v5.6.6；测试数 608→650→663→751
    # 期间官网多次只改了部分位置；官网更新日志还出现过版本标签与内容错位
    # （v5.6.8 的内容被标成 v5.6.9、v5.6.0 的内容被标成 v5.6.1）与整条版本漏加。
    # 这些都不是代码缺陷，静态扫描与 pytest 都抓不到，只能靠断言数字的一致性来守护。
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 与 test job 使用同一套锁定工具链，确保「实际收集数」与测试 job 一致
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Check docs & website consistency
        run: python scripts/check_docs_consistency.py

  typecheck:
    runs-on: ubuntu-latest
    # 实验性 job：mypy 静态类型检查，不阻断合并（v5.7.0）
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install mypy
        run: |
          python -m pip install --upgrade pip
          pip install mypy==1.14.1

      - name: Type check (experimental)
        run: |
          # 只检查核心层；第三方包忽略导入。实验性阶段以发现新问题为目标，
          # 不要求全绿，配合 continue-on-error 观察趋势。
          mypy core/ --ignore-missing-imports --follow-imports=skip || true
