[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "MindForge"
dynamic = ["version"]
description = "AI Agent 终身记忆系统 - 四层记忆架构 · 知识图谱 · 多模态支持"
readme = {file = "README.md", content-type = "text/markdown"}
license = {text = "MIT"}
requires-python = ">=3.9"
keywords = ["ai", "agent", "memory", "knowledge-graph", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["cryptography>=50.0.1,<52"]

[project.urls]
Homepage = "https://github.com/opok-ops/MindForge"
Documentation = "https://opok-ops.github.io/MindForge/"
"Bug Reports" = "https://github.com/opok-ops/MindForge/issues"
Source = "https://github.com/opok-ops/MindForge"

[project.scripts]
MindForge = "mindforge.cli.main:main"
MindForge-mcp = "mindforge.mcp.server:main"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]
embedding = ["sentence-transformers>=2.2.0"]

# 所有包统一在 mindforge.* 命名空间下，避免 core/mcp/api/cli/modules/adapters
# 直接进入 site-packages 顶层与其他库冲突。
# package-dir 把源码目录映射到命名空间包，无需物理移动文件。
[tool.setuptools]
packages = [
    "mindforge",
    "mindforge.core",
    "mindforge.modules",
    "mindforge.cli",
    "mindforge.api",
    "mindforge.mcp",
    "mindforge.adapters",
]

[tool.setuptools.package-dir]
"mindforge" = "mindforge"
"mindforge.core" = "core"
"mindforge.modules" = "modules"
"mindforge.cli" = "cli"
"mindforge.api" = "api"
"mindforge.mcp" = "mcp"
"mindforge.adapters" = "adapters"

# 版本号唯一真值：core/version.py 的 __version__
[tool.setuptools.dynamic]
version = {attr = "mindforge.core.version.__version__"}
