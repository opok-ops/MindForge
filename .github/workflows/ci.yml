name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 确定性安装：先装运行依赖锁定版，再装开发/测试工具锁定版
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Smoke test — CLI
        run: |
          python -c "from cli.main import main; main(['--help'])"

      - name: Smoke test — MCP tools/list
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          from mcp.server import _handle_tools_list
          tools = _handle_tools_list({})['tools']
          assert len(tools) >= 30, f'Expected at least 30 tools, got {len(tools)}'
          print(f'MCP tools: {len(tools)} OK')
          "

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"
          pip install bandit pip-audit

      - name: Bandit scan
        run: |
          # 仅对 HIGH 严重度失败，使安全扫描真正生效（历史上 `|| true` 形同虚设）。
          # 选用 -lll（= HIGH only）：项目代码经人工审查无真实 HIGH 漏洞；
          # 既有 Medium（B608 参数化占位符误报、scripts/baidu_push 的 B310/B314）
          # 均为可接受低风险，详见发布说明与安全报告，不阻断正常 CI。
          # 排除 .venv/venv/website/examples，避免本地或演示目录污染扫描结果。
          bandit -r . -x tests,.venv,venv,website,examples -lll

      - name: pip-audit
        run: |
          # 只审计项目直接依赖，不扫 runner 预装包（避免不可控的 CVE 噪音）
          python -c "import tomllib; print('\n'.join(tomllib.load(open('pyproject.toml','rb'))['project']['dependencies']))" > /tmp/reqs.txt
          pip-audit --strict -r /tmp/reqs.txt
