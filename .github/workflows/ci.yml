name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short --cov=mindforge.core --cov=mindforge.modules --cov-report=term-missing

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: .coverage
          retention-days: 14

      - name: Smoke test — CLI
        run: |
          python -c "from mindforge.cli.main import main; main(['--help'])"

      - name: Smoke test — MCP tools/list
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          from mindforge.mcp.server import _handle_tools_list
          tools = _handle_tools_list({})['tools']
          assert len(tools) == 56, f'Expected exactly 56 tools, got {len(tools)}'
          print(f'MCP tools: {len(tools)} OK')
          "

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: No tracked source maps
        run: |
          MAPS=$(git ls-files '*.map')
          if [ -n "$MAPS" ]; then
            echo '::error::source map 文件被 git 跟踪'
            echo "$MAPS"
            exit 1
          fi
          echo 'no tracked source maps: OK'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"
          pip install bandit pip-audit

      - name: Bandit scan
        run: |
          bandit -r . -x tests,.venv,venv,website,examples -lll

      - name: pip-audit
        run: |
          python -c "import tomllib; print('\n'.join(tomllib.load(open('pyproject.toml','rb'))['project']['dependencies']))" > /tmp/reqs.txt
          pip-audit --strict -r /tmp/reqs.txt

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Check docs & website consistency
        run: python scripts/check_docs_consistency.py

  typecheck:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install mypy
        run: |
          python -m pip install --upgrade pip
          pip install mypy==1.14.1

      - name: Type check (experimental)
        run: |
          mypy core/ --ignore-missing-imports --follow-imports=skip || true
