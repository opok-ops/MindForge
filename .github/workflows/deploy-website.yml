name: Deploy Website to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'website/**'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Update sitemap lastmod dates
        run: |
          TODAY=$(date +%Y-%m-%d)
          echo "Updating sitemap lastmod to $TODAY"
          sed -i "s/<lastmod>[0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}<\/lastmod>/<lastmod>$TODAY<\/lastmod>/g" website/sitemap.xml
          echo "Updated sitemap.xml:"
          head -20 website/sitemap.xml

      - name: 注入百度站长验证码
        env:
          BAIDU_CODE: ${{ secrets.BAIDU_SITE_VERIFICATION }}
        run: |
          # 只有配置了 Secret 才注入；未配置时占位符保持为注释，不影响页面渲染
          if [ -n "$BAIDU_CODE" ]; then
            if ! grep -q '<!--BAIDU_VERIFY_SLOT-->' website/index.html; then
              echo "::error::index.html 中找不到占位符 <!--BAIDU_VERIFY_SLOT-->，无法注入百度验证码。"
              exit 1
            fi
            echo "已检测到 BAIDU_SITE_VERIFICATION，注入验证标签"
            sed -i "s|<!--BAIDU_VERIFY_SLOT-->|<meta name=\"baidu-site-verification\" content=\"$BAIDU_CODE\">|" website/index.html
            if grep -q 'baidu-site-verification' website/index.html; then
              grep -o 'baidu-site-verification[^>]*' website/index.html | head -1
            else
              echo "::error::注入后仍未检索到验证标签，请检查 Secret 值是否含特殊字符（如引号/换行）。"
              exit 1
            fi
          else
            echo "::notice::未配置 Secrets.BAIDU_SITE_VERIFICATION，跳过验证码注入（不影响部署）。"
            printf '%s\n' \
              '## ℹ️ 百度站点所有权验证：未配置' \
              '' \
              '首页保留占位注释 `<!--BAIDU_VERIFY_SLOT-->`，**百度无法验证本站归属**，' \
              '因此主动推送接口也无法使用（百度要求先验证、再推送）。' \
              '' \
              '配置 Secret `BAIDU_SITE_VERIFICATION` 后重新部署即可自动注入。' \
              '步骤见 `docs/百度站长平台收录指南.md`。' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./website

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
