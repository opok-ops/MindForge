[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "MindForge"
version = "5.6.5"
description = "AI Agent 终身记忆系统 - 四层记忆架构 · 知识图谱 · 多模态支持"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
keywords = ["ai", "agent", "memory", "knowledge-graph", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# 运行依赖：仅 cryptography。加 <52 上限作为供应链护栏，
# 避免未来大版本（可能含破坏性变更）在无人维护期间被自动拉入。
# 确定性安装请使用仓库根目录的 requirements.txt。
dependencies = ["cryptography>=50.0.1,<52"]

[project.urls]
Homepage = "https://opok-ops.github.io/MindForge/"
"Bug Reports" = "https://github.com/opok-ops/MindForge/issues"
Source = "https://github.com/opok-ops/MindForge"

[project.scripts]
MindForge = "cli.main:main"
MindForge-mcp = "mcp.server:main"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]
embedding = ["sentence-transformers>=2.2.0"]

[tool.setuptools]
py-modules = ["MindForge"]

[tool.setuptools.packages.find]
exclude = ["tests*", "website*", "examples*", "data*"]
