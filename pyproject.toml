[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mindforge-memory"
dynamic = ["version"]
description = "AI Agent 终身记忆系统 - 四层记忆架构 · 知识图谱 · 多模态支持"
readme = {file = "README.md", content-type = "text/markdown"}
license = {text = "MIT"}
requires-python = ">=3.9"
keywords = ["ai", "agent", "memory", "knowledge-graph", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["cryptography>=50.0.1,<52"]

[project.urls]
Homepage = "https://github.com/opok-ops/MindForge"
Documentation = "https://opok-ops.github.io/MindForge/"
"Bug Reports" = "https://github.com/opok-ops/MindForge/issues"
Source = "https://github.com/opok-ops/MindForge"

[project.scripts]
MindForge = "mindforge.cli.main:main"
MindForge-mcp = "mindforge.mcp.server:main"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]
embedding = ["sentence-transformers>=2.7.0"]

# 所有源码统一位于 mindforge.* 命名空间下（物理目录即包目录），
# 不再以 core/mcp/api/cli/modules/adapters 等顶层名称进入 site-packages，
# 避免与其他库冲突。仓库根目录保留 MindForge.py 作为向后兼容入口。
[tool.setuptools]
packages = [
    "mindforge",
    "mindforge.core",
    "mindforge.modules",
    "mindforge.cli",
    "mindforge.api",
    "mindforge.mcp",
    "mindforge.adapters",
]
py-modules = ["MindForge"]

# 版本号唯一真值：mindforge/core/version.py 的 __version__
[tool.setuptools.dynamic]
version = {attr = "mindforge.core.version.__version__"}
